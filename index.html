<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Welcome to Rock Paper Scissors!</h1>
<div id="game">

</div>
<div id="score">
    <div id="humanScore" class="scoreBox">
        <div class="scoreValue">

        </div>
        <div class="player">Human</div>
    </div>
    <div id="dash">-</div>
    <div id="computerScore" class="scoreBox">
        <div class="scoreValue">

        </div>
        <div class="player">Computer</div>
    </div>

</div>
<div id="controls">
    <button id="playRound" class="controlButton">Play Round</button>
</div>
<div id="decisionContainer">
    <p id="hDecision">Your Choice: <span></span></p>
    <p id="cDecision">Computer Choice: <span></span></p>
    <p id="winner">Winner: <span></span></p>
</div>
<script src="javascript.js">

</script>

</body>
</html>
